<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>双11 惊喜礼</title>
<style>
:root{--navy:#062530;--gold:#F2C14E;--gold2:#F6D98B;--red:#C8102E;--light:#EFEFEF;--pk:#C8102E;--pk2:#A50D24;--pk3:#8E0F18;--pkb:#F2C14E;--seal:#F2C14E;--sealt:#7A1A14}
body[data-tier="4"]{--pk:#0D5A70;--pk2:#07394B;--pk3:#052B38;--pkb:#F2C14E}
body[data-tier="6"]{--pk:#E8B84A;--pk2:#CC9A30;--pk3:#A87A1E;--pkb:#FFF1C2;--seal:#C8102E;--sealt:#FFE9A8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--navy);color:var(--light);font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
.app{position:relative;max-width:460px;min-height:100vh;min-height:100dvh;margin:0 auto;padding:22px 16px 28px;background:var(--navy) url(img/bg.webp) top center/cover no-repeat;overflow:hidden;overflow:clip}
.tag{display:block;width:max-content;margin:0 auto;padding:4px 14px;border:1px solid rgba(242,193,78,.6);border-radius:99px;font-size:13px;color:var(--gold2)}
h1{margin:10px 0 2px;text-align:center;font-size:42px;line-height:1.15;font-weight:800;color:var(--gold);letter-spacing:2px}
.sub{margin:0;text-align:center;font-size:15px;color:#CFE0E5}
.left{display:block;width:max-content;margin:12px auto 16px;padding:7px 20px;border-radius:99px;background:var(--red);color:#fff;font-size:15px;font-weight:700}
.left b{font-size:21px;color:var(--gold2);margin:0 2px}
.cap{margin:0 0 8px;text-align:center;font-size:13px;color:var(--gold2)}
.show{display:flex;flex-wrap:wrap;justify-content:center;margin:0 -3px 12px}
.ti{position:relative;flex:0 0 calc(25% - 6px);margin:0 3px 8px;background:rgba(239,239,239,.94);border-radius:10px;padding:6px 3px 5px;text-align:center}
.ti img{display:block;width:100%;height:50px;object-fit:contain}
.ti span{display:block;margin-top:3px;font-size:11px;line-height:1.25;color:var(--navy);font-weight:600}
.ti.top{background:var(--gold);outline:2px solid var(--gold2)}
.ti.top em{position:absolute;top:-9px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:1px 8px;border-radius:99px;background:var(--red);color:#fff;font-size:11px;font-style:normal;font-weight:700}
.gate{margin-top:20px;padding:20px 16px;border:1px solid rgba(242,193,78,.5);border-radius:14px;background:rgba(2,14,20,.55)}
.gate label{display:block;margin-bottom:10px;text-align:center;font-size:16px;font-weight:700}
.gate input{display:block;width:100%;padding:13px;border:0;border-radius:10px;background:#fff;color:var(--navy);font:inherit;font-size:18px;text-align:center}
.err{min-height:18px;margin:6px 0 0;text-align:center;font-size:13px;color:#FFB4A8}
.fine{margin:10px 0 0;text-align:center;font-size:12px;color:#A9C4CC}
.grid{display:flex;flex-wrap:wrap;justify-content:center;margin:0 -4px}
.pk{position:relative;flex:0 0 calc(25% - 8px);margin:4px;padding:0;border:1px solid var(--pkb);border-radius:10px;background:var(--pk);cursor:pointer;overflow:hidden;font:inherit}
.pk::after{content:"";display:block;padding-top:133%}
.pk::before{content:"";position:absolute;left:-6%;right:-6%;top:-18%;height:52%;border-radius:50%;background:var(--pk2)}
.pk i{position:absolute;left:50%;top:34%;width:30px;height:30px;transform:translate(-50%,-50%);border-radius:50%;background:var(--seal);color:var(--sealt);font-style:normal;font-weight:800;font-size:14px;display:grid;place-items:center}
.pk.wig{animation:wig .7s ease-in-out}
.pk.done{background:rgba(239,239,239,.94);border-color:var(--gold2);cursor:default}
.pk.done::before,.pk.done i{display:none}
.pk.done img{position:absolute;top:3%;left:3%;width:94%;height:94%;object-fit:contain;animation:pop .4s ease-out}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
.ov{position:fixed;top:0;right:0;bottom:0;left:0;z-index:20;overflow:hidden;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:rgba(2,14,20,.9)}
.ov.on{display:flex}
.stage{position:relative;width:260px;height:300px;display:grid;place-items:center}
.rays{position:absolute;left:50%;top:50%;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;background:repeating-conic-gradient(rgba(242,193,78,.34) 0 11deg,transparent 11deg 24deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent 68%);mask:radial-gradient(circle,#000 18%,transparent 68%);opacity:0;transition:opacity .5s;animation:spin 14s linear infinite}
.ov.big .rays{background:repeating-conic-gradient(rgba(242,193,78,.6) 0 11deg,transparent 11deg 24deg)}
.bp{position:relative;width:200px;height:270px;perspective:800px}
.bp-back{position:absolute;top:0;right:0;bottom:0;left:0;background:var(--pk3);border-radius:16px;transition:opacity .35s .3s}
.bp-prize{position:absolute;left:50%;top:50%;width:250px;height:250px;object-fit:contain;transform:translate(-50%,-34%) scale(.4);opacity:0;z-index:2;transition:transform .75s cubic-bezier(.2,1.55,.4,1) .12s,opacity .25s .12s}
.bp-front{position:absolute;left:0;right:0;bottom:0;height:74%;background:var(--pk);border-radius:0 0 16px 16px;z-index:3;transition:transform .55s ease-in,opacity .4s ease-in .15s}
.bp-flap{position:absolute;left:0;right:0;top:0;height:44%;background:var(--pk2);border-radius:16px 16px 50% 50%/16px 16px 34% 34%;transform-origin:top;z-index:4;transition:transform .4s,opacity .3s .2s}
.bp-seal{position:absolute;left:50%;top:44%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;background:var(--seal);color:var(--sealt);font-weight:800;font-size:24px;display:grid;place-items:center;z-index:5;transition:transform .35s}
.bp.shake{animation:shake .8s ease-in-out}
.bp.open .bp-back{opacity:0}
.bp.open .bp-flap{transform:rotateX(170deg);opacity:0}
.bp.open .bp-seal{transform:scale(0) rotate(200deg)}
.bp.open .bp-front{transform:translateY(130%);opacity:0}
.bp.open .bp-prize{transform:translate(-50%,-50%) scale(1);opacity:1}
.ov.opened .rays{opacity:1}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-6deg) scale(1.03)}30%{transform:rotate(6deg) scale(1.05)}45%{transform:rotate(-7deg) scale(1.07)}60%{transform:rotate(7deg) scale(1.09)}80%{transform:rotate(-4deg) scale(1.06)}}
@keyframes spin{to{transform:rotate(360deg)}}
.res{position:relative;z-index:6;width:100%;max-width:340px;text-align:center;opacity:0;transform:translateY(14px);transition:opacity .35s,transform .35s;visibility:hidden}
.res.in{opacity:1;transform:none;visibility:visible}
.res p{margin:0}
.res .a{font-size:15px;color:var(--gold2)}
.res .b{margin:4px 0 2px;font-size:29px;line-height:1.2;font-weight:800;color:#fff}
.ov.big .res .b{color:var(--gold)}
.res .c{font-size:13px;color:#CFE0E5}
.btn{display:block;width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:var(--gold);color:#3A2404;font:inherit;font-size:18px;font-weight:800;cursor:pointer;text-align:center;text-decoration:none}
.sum h2{margin:18px 0 12px;text-align:center;font-size:24px;font-weight:800;color:var(--gold)}
.row{display:flex;align-items:center;margin-bottom:8px;padding:8px 12px;border-radius:12px;background:rgba(239,239,239,.94);color:var(--navy)}
.row img{width:56px;height:56px;margin-right:12px;object-fit:contain}
.row b{flex:1;font-size:16px}
.row.top{background:var(--gold)}
.note{margin:12px 0 0;text-align:center;font-size:14px;color:#CFE0E5}
@media(max-height:600px){.stage{transform:scale(.68);margin:-48px 0}}
.topbar{position:sticky;top:0;z-index:10;margin:-22px -16px 14px}
.pvbar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#6b3fa0;color:#fff;font-size:13px}
.cdown{padding:8px 10px;background:#A50D24;color:#fff;font-size:14px;font-weight:700;text-align:center;white-space:nowrap}
.cdown b{display:inline-block;min-width:26px;margin:0 2px;padding:1px 4px;border-radius:5px;background:#F2C14E;color:#5A1410;font-weight:800;font-variant-numeric:tabular-nums}
.pvbar a{color:#fff;font-weight:700}
[hidden]{display:none!important}
canvas{position:fixed;top:0;left:0;z-index:30;pointer-events:none}
</style>
</head>
<body>
<main class="app">
  <div class="topbar">
    <div class="pvbar" id="pvBar" hidden><span>👁 预览模式，不影响真实数据</span><a href="admin">退出</a></div>
    <div class="cdown" id="cdown"></div>
  </div>
  <span class="tag" id="tag">MFormula 双11</span>
  <h1 id="title">拆惊喜礼</h1>
  <p class="sub" id="sub">6 份惊喜礼，一定有 RM50 现金回扣</p>
  <span class="left" id="left" hidden></span>

  <section class="gate" id="gate">
    <label for="cname">你的名字</label>
    <input id="cname" autocomplete="name" maxlength="40" placeholder="写你的名字">
    <label for="phone" id="plabel" style="margin-top:14px">你的电话号码</label>
    <input id="phone" inputmode="tel" autocomplete="tel" placeholder="0123456789 或 +65 81234567">
    <p class="err" id="err"></p>
    <button class="btn" id="go" style="margin-top:6px">开始拆惊喜礼</button>
    <p class="fine">每个号码只能玩一次</p>
  </section>


  <section id="play" hidden>
    <p class="cap">双11 惊喜礼</p>
    <div class="show" id="show"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="sum" id="sum" hidden>
    <h2>你的 6 份惊喜礼</h2>
    <p class="note" style="margin:0 0 12px;color:#F6D98B;font-weight:700">记得截图发给 Ah Kent</p>
    <div id="list"></div>
    <p class="note">惊喜礼会跟你的订单一起寄出</p>
    <button class="btn" id="send">截图发给 Ah Kent</button>
    <p class="note" id="sendNote"></p>
  </section>
</main>

<div class="ov" id="ov">
  <div class="stage">
    <div class="rays"></div>
    <div class="bp" id="bp">
      <div class="bp-back"></div>
      <img class="bp-prize" id="bpImg" alt="">
      <div class="bp-front"></div>
      <div class="bp-flap"></div>
      <div class="bp-seal">11</div>
    </div>
  </div>
  <div class="res" id="res">
    <p class="a" id="resA"></p>
    <p class="b" id="resB"></p>
    <p class="c">惊喜礼会跟你的订单一起寄出</p>
    <button class="btn" id="next"></button>
  </div>
</div>
<canvas id="fx"></canvas>

<script src="shared.js"></script>
<script>
const POOL = PRIZES.map(p => ({...p, img:"img/" + p.id + ".webp", top:p.id === "box2"}));
const $ = id => document.getElementById(id);
const preview = new URLSearchParams(location.search).get("preview") === "1";
const TOTAL = 6;
let left = 0, who = "", phone = "", seq = [], cells = {}, busy = false;
const byId = id => POOL.find(p => p.id === id);

// progress on this phone only counts if it belongs to the prizes the server just returned
function loadCells() {
  if (preview) return {};
  try {
    const saved = JSON.parse(localStorage.getItem("mf1111-" + phone));
    return saved && JSON.stringify(saved.seq) === JSON.stringify(seq) ? saved.cells : {};
  } catch (e) { return {}; }
}

function saveCells() {
  if (preview) return;
  try { localStorage.setItem("mf1111-" + phone, JSON.stringify({seq, cells})); } catch (e) {}
}

// the admin name turns the phone box into a password box, same as the main site
const isAdminName = v => String(v).trim().toLowerCase() === "mformulammd";

function syncField() {
  const a = isAdminName($("cname").value), p = $("phone");
  p.type = a ? "password" : "text";
  p.autocomplete = a ? "current-password" : "tel";
  p.placeholder = a ? "" : "0123456789 或 +65 81234567";
  $("plabel").textContent = a ? "密码" : "你的电话号码";
  $("go").textContent = a ? "登录" : "开始拆惊喜礼";
}

async function startGame() {
  if ($("go").disabled) return;
  const admin = isAdminName($("cname").value), name = cleanName($("cname").value), d = cleanPhone($("phone").value);
  if (!name) { $("err").textContent = "请写你的名字"; return; }
  if (admin && !$("phone").value) { $("err").textContent = "请写密码"; return; }
  if (!admin && !d) { $("err").textContent = "请输入你的电话号码"; return; }
  $("go").disabled = true; $("go").textContent = "请稍等";
  try {
    if (admin) {
      const r = await adminLogin($("phone").value);
      if (r.ok) { location.href = "admin"; return; }
      $("err").textContent = "密码不对";
    } else {
      const r = await api({a:"play", name, phone:d});
      if (r.ok) { who = name; phone = d; paint(r); }
      else $("err").textContent = r.error === "closed" ? "活动还没开始，请等 Ah Kent 通知" : r.error === "ended" ? "活动已经结束了" : "网络不稳，再试一次";
    }
  } catch (e) {
    $("err").textContent = "网络不稳，再试一次";
  }
  $("go").disabled = false; syncField();
}

function paint(r) {
  seq = r.seq; cells = loadCells(); busy = false;
  $("show").innerHTML = POOL.filter(p => r.show.includes(p.id)).map(p => `<div class="ti${p.top ? " top" : ""}">${p.top ? "<em>大奖</em>" : ""}<img src="${p.img}" alt=""><span>${p.short}</span></div>`).join("");
  const g = $("grid"); g.innerHTML = "";
  for (let i = 0; i < 11; i++) {
    const b = document.createElement("button");
    b.className = "pk"; b.dataset.i = i; b.innerHTML = "<i>11</i>"; b.setAttribute("aria-label", "红包 " + (i + 1));
    b.onclick = () => openPacket(b);
    if (cells[i]) markOpen(b, byId(cells[i]));
    g.appendChild(b);
  }
  left = TOTAL - Object.keys(cells).length;
  $("gate").hidden = true; $("play").hidden = false; $("sum").hidden = true; $("left").hidden = false;
  showLeft();
  if (left <= 0) { $("sub").textContent = "这个号码已经拆完了"; finish(); }
}

function markOpen(el, p) {
  el.classList.add("done");
  el.innerHTML = `<img src="${p.img}" alt="${p.name}">`;
}

function showLeft() {
  $("left").innerHTML = left > 0 ? `你还有<b>${left}</b>次机会` : "全部拆完了";
}

function openPacket(el) {
  if (busy || left <= 0 || el.classList.contains("done")) return;
  busy = true;
  const p = byId(seq[Object.keys(cells).length]);
  cells[el.dataset.i] = p.id; left--; saveCells();
  const ov = $("ov"), bp = $("bp"), res = $("res");
  $("bpImg").src = p.img;
  $("resA").textContent = p.top ? "大奖！恭喜你抽到" : "恭喜你抽到";
  $("resB").textContent = p.name;
  $("next").textContent = left > 0 ? `再拆一个（还有 ${left} 次）` : "看我的礼物";
  ov.className = "ov on" + (p.top ? " big" : "");
  res.classList.remove("in");
  bp.className = "bp"; void bp.offsetWidth; bp.className = "bp shake";
  setTimeout(() => {
    bp.className = "bp open"; ov.classList.add("opened");
    confetti(p.top ? 340 : 150);
    try { navigator.vibrate && navigator.vibrate(p.top ? [80, 60, 160] : 60); } catch (e) {}
  }, 850);
  setTimeout(() => res.classList.add("in"), 1400);
  markOpen(el, p);
  showLeft();
}

$("next").onclick = () => {
  $("ov").className = "ov"; busy = false;
  if (left > 0) nudge(); else finish();
};

let picture = null, message = "";

function finish() {
  $("play").hidden = true; $("sum").hidden = false;
  const won = seq.map(byId);
  $("list").innerHTML = won.map(p => `<div class="row${p.top ? " top" : ""}"><img src="${p.img}" alt=""><b>${p.name}</b></div>`).join("");
  message = "Hi Kent，我是 " + who + "，我拆完惊喜礼了：" + won.map(p => p.name).join("、");
  picture = drawPicture(won).catch(() => null);
}

const loadImg = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });

// the "screenshot": name, last 4 digits, package and prizes as one picture
async function drawPicture(won) {
  const W = 720, rowH = 124, H = 330 + won.length * rowH;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  const font = (px, weight) => `${weight} ${px}px "PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif`;
  x.fillStyle = "#062530"; x.fillRect(0, 0, W, H);
  x.textAlign = "center";
  x.fillStyle = "#F6D98B"; x.font = font(26, 400); x.fillText("MFormula 双11", W / 2, 62);
  x.fillStyle = "#F2C14E"; x.font = font(52, 800); x.fillText("你的双11 惊喜礼", W / 2, 132);
  x.fillStyle = "#FFFFFF"; x.font = font(30, 700); x.fillText(who, W / 2, 192);
  x.fillStyle = "#CFE0E5"; x.font = font(24, 400); x.fillText("电话尾号 " + phone.slice(-4), W / 2, 232);
  const imgs = await Promise.all(won.map(p => loadImg(p.img)));
  won.forEach((p, i) => {
    const y = 262 + i * rowH, h = rowH - 16;
    x.fillStyle = p.top ? "#F2C14E" : "#EFEFEF";
    x.fillRect(32, y, W - 64, h);
    const im = imgs[i], s = Math.min(92 / im.width, 92 / im.height);
    x.drawImage(im, 62 + (92 - im.width * s) / 2, y + 8 + (92 - im.height * s) / 2, im.width * s, im.height * s);
    x.textAlign = "left"; x.fillStyle = "#062530"; x.font = font(32, 700); x.fillText(p.name, 176, y + 66);
  });
  x.textAlign = "center"; x.fillStyle = "#CFE0E5"; x.font = font(24, 400);
  x.fillText("惊喜礼会跟你的订单一起寄出", W / 2, H - 28);
  return new Promise(ok => c.toBlob(ok, "image/png"));
}

async function sendResult() {
  if (preview) { $("sendNote").textContent = "预览模式，不会发出去"; return; }
  const chat = "https://wa.me/601135155309?text=" + encodeURIComponent(message);
  const blob = await picture;
  if (!blob) { location.href = chat; return; }
  const file = new File([blob], "mformula-1111.png", {type:"image/png"});
  if (navigator.canShare && navigator.canShare({files:[file]})) {
    try { await navigator.share({files:[file], text:message}); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  // no share sheet here: save the picture, then open the chat
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  $("sendNote").textContent = "图片已经存好，在 WhatsApp 发给 Ah Kent";
  setTimeout(() => { location.href = chat; }, 900);
}

function nudge() {
  const a = [...document.querySelectorAll(".pk:not(.done)")];
  if (!a.length) return;
  const b = a[Math.floor(Math.random() * a.length)];
  b.classList.remove("wig"); void b.offsetWidth; b.classList.add("wig");
}
setInterval(() => { if (!busy && left > 0) nudge(); }, 2200);

let fxRun = 0;
function confetti(n) {
  const run = ++fxRun, c = $("fx"), x = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const col = ["#F2C14E", "#F6D98B", "#C8102E", "#FFFFFF", "#26768A"];
  const ps = Array.from({length: n}, () => {
    const a = Math.random() * Math.PI * 2, s = 3 + Math.random() * 9;
    return {x: c.width / 2, y: c.height * .4, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 4, w: 5 + Math.random() * 6, h: 8 + Math.random() * 7, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: col[Math.floor(Math.random() * col.length)]};
  });
  let t = 0;
  (function tick() {
    if (run !== fxRun) return;
    x.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += .22; p.vx *= .99; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c;
      x.globalAlpha = Math.max(0, 1 - t / 130); x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore();
    });
    if (++t < 130) requestAnimationFrame(tick); else x.clearRect(0, 0, c.width, c.height);
  })();
}

function tickDown() {
  const s = Math.max(0, Math.floor((END_AT - Date.now()) / 1000));
  const pad = n => String(n).padStart(2, "0");
  $("cdown").innerHTML = s ? `活动倒数 <b>${Math.floor(s / 86400)}</b>天 <b>${pad(Math.floor(s / 3600) % 24)}</b>时 <b>${pad(Math.floor(s / 60) % 60)}</b>分 <b>${pad(s % 60)}</b>秒` : "活动已经结束了";
}
tickDown();
setInterval(tickDown, 1000);

$("go").onclick = startGame;
$("send").onclick = sendResult;
$("phone").oninput = () => { $("err").textContent = ""; };
$("cname").oninput = () => { $("err").textContent = ""; syncField(); };
$("cname").onkeydown = $("phone").onkeydown = e => { if (e.key === "Enter") startGame(); };
syncField();

async function startPreview() {
  try {
    const r = await api({a:"preview"});
    if (!r.ok) { $("err").textContent = "请先登录后台"; return; }
    who = "预览"; phone = "0000"; $("pvBar").hidden = false; paint(r);
  } catch (e) { $("err").textContent = "网络不稳，再试一次"; }
}
if (preview) startPreview();
